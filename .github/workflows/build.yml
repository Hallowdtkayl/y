name: Build APK

# Phone-friendly: upload ONE zip (e.g. DoctorClass-v14.zip) to the root of the repository.
# This workflow unpacks it over the project, then builds the APK and publishes it under Releases.
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack an uploaded zip over the project (if there is one)
        run: |
          set -e
          shopt -s nullglob
          zips=( *.zip )
          if [ ${#zips[@]} -eq 0 ]; then echo "no zip at the root, building as is"; exit 0; fi
          # several zips: apply them in version order, the newest last
          mapfile -t zips < <(printf '%s\n' "${zips[@]}" | sort -V)
          for z in "${zips[@]}"; do
            echo "Applying $z"
            rm -rf /tmp/pkg && mkdir /tmp/pkg
            unzip -q "$z" -d /tmp/pkg
            src=/tmp/pkg
            # a zip that holds a single folder: use that folder as the project root
            if [ ! -f /tmp/pkg/settings.gradle.kts ] && [ "$(ls -A /tmp/pkg | wc -l)" = "1" ] && [ -d "/tmp/pkg/$(ls -A /tmp/pkg)" ]; then
              src="/tmp/pkg/$(ls -A /tmp/pkg)"
            fi
            [ -f "$src/settings.gradle.kts" ] || { echo "not a project zip: $z"; exit 1; }
            # workflow files cannot be changed with the built-in token: leave .github as it is
            rm -rf "$src/.github"
            # the sources are replaced as a whole so deleted files really disappear
            rm -rf app/src
            cp -a "$src"/. ./
            rm -f "$z"
          done
          # keep the repository in step with what is being built (the zip is removed, the files are in)
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing changed"; else git commit -q -m "Import uploaded zip" && git push origin "HEAD:${GITHUB_REF_NAME}"; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Keep APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: DoctorClass.apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk DoctorClass.apk
          gh release create "build-${{ github.run_number }}" DoctorClass.apk \
            --title "Build ${{ github.run_number }}" \
            --notes "Automatic build from commit ${{ github.sha }}"
