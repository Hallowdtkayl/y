name: Import uploaded zip

# From a phone: upload ONE zip (e.g. DoctorClass-v14.zip) to the root of the repository.
# This workflow unpacks it over the project, deletes the zip, and starts the APK build.
on:
  push:
    branches: [ main, master ]
    paths: [ '*.zip' ]

permissions:
  contents: write
  actions: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack the zip(s) over the project
        run: |
          set -e
          shopt -s nullglob
          zips=( *.zip )
          [ ${#zips[@]} -gt 0 ] || { echo "no zip at the root"; exit 0; }
          # several zips: apply them in version order, the newest last
          mapfile -t zips < <(printf '%s\n' "${zips[@]}" | sort -V)
          for z in "${zips[@]}"; do
            echo "Applying $z"
            rm -rf /tmp/pkg && mkdir /tmp/pkg
            unzip -q "$z" -d /tmp/pkg
            src=/tmp/pkg
            # a zip that holds a single folder: use that folder as the project root
            if [ ! -f /tmp/pkg/settings.gradle.kts ] && [ "$(ls -A /tmp/pkg | wc -l)" = "1" ] && [ -d "/tmp/pkg/$(ls -A /tmp/pkg)" ]; then
              src="/tmp/pkg/$(ls -A /tmp/pkg)"
            fi
            [ -f "$src/settings.gradle.kts" ] || { echo "not a project zip: $z"; exit 1; }
            # workflow files cannot be changed with the built-in token: leave .github as it is
            rm -rf "$src/.github"
            # the sources are replaced as a whole so deleted files really disappear
            rm -rf app/src
            cp -a "$src"/. ./
            rm -f "$z"
          done

      - name: Commit and start the build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "nothing changed"; exit 0; }
          git commit -q -m "Import uploaded zip"
          git push
          # pushes made with the built-in token do not start other workflows, so start the build explicitly
          gh workflow run build.yml --ref "${GITHUB_REF_NAME}"
